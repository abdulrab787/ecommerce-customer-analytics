# Move this file to .github/workflows/quality.yml to run tests + the DQ gate on every push.
name: data-quality-and-tests
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q tests
      - name: Experiment readouts
        run: |
          python -m src.experimentation.simulate
          python -m src.experimentation.decide
      - name: Data-quality gate (fails the build on critical issues)
        run: python -m src.data_quality.runner --config config/dq_rules.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: quality-reports, path: reports/}
